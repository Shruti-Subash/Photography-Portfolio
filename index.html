<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shruti Subash — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --bg-alt: #ebe6dd;
    --ink: #18130d;
    --ink-soft: #4b4338;
    --line: rgba(24,19,13,0.18);
    --accent: #8a6a3a;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.55; }
  img { display: block; width: 100%; height: auto; transition: transform 0.8s cubic-bezier(0.2, 0, 0.2, 1); }
  a { color: inherit; text-decoration: none; }

  /* Nav */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 36px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    background: rgba(244,241,236,0.7); border-bottom: 1px solid var(--line);
  }
  .nav .brand { font-family: var(--serif); font-size: 24px; letter-spacing: 0.02em; }
  .nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 24px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; }
  .nav ul li a:hover { color: var(--accent); }

  /* Hero */
  .hero {
    position: relative; height: 100vh; display: flex; align-items: flex-end; padding: 0 36px 100px;
    background: #000 url("images/skyscapes/05-purple-city-sunset.jpeg") center/cover no-repeat;
  }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%); }
  .hero-inner { position: relative; z-index: 10; color: #fff; }
  .hero h1 { font-family: var(--serif); font-size: clamp(60px, 12vw, 160px); line-height: 0.85; margin: 0; font-weight: 300; }
  .hero h1 em { font-style: italic; }

  /* Section Styles */
  section.block { padding: 120px 36px; }
  .section-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 20px; margin-bottom: 60px; border-bottom: 1px solid var(--line);
  }
  .section-head h2 { font-family: var(--serif); font-size: 56px; font-weight: 300; margin: 0; line-height: 1; }
  .section-head .num { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--accent); margin-right: 15px; }

  /* MASONRY GRID - CRITICAL FOR FULL RATIO */
  .masonry {
    column-count: 3;
    column-gap: 30px;
  }
  .masonry figure {
    break-inside: avoid;
    margin: 0 0 30px;
    background: var(--bg-alt);
    position: relative;
    overflow: hidden;
  }
  .masonry figure:hover img { transform: scale(1.03); }
  .masonry figcaption {
    padding: 12px 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft);
  }

  @media (max-width: 1000px) { .masonry { column-count: 2; } }
  @media (max-width: 600px) { .masonry { column-count: 1; } .nav ul { display: none; } }

  /* About */
  .about { padding: 120px 36px; background: var(--bg-alt); display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .about h3 { font-family: var(--serif); font-size: 64px; font-weight: 300; margin: 0 0 20px; }
  
  footer { padding: 60px 36px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; }

  .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
  .reveal.in { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<nav class="nav">

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in');
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
